name: Build Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  TYPST_COMMIT: bd5ebec285505889e8ff1d4f68804ab147a699f3

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x86_64
            runner: macos-latest
            target: x86_64-apple-darwin

    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
      NO_STRIP: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: typst-desktop

      - name: Clone Typst compiler
        shell: bash
        run: |
          git clone https://github.com/typst/typst.git typst-desktop/typst
          git -C typst-desktop/typst checkout "$TYPST_COMMIT"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            build-essential \
            file \
            curl \
            wget \
            jq \
            xdg-utils

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            typst-desktop/src-tauri/target
          key: cargo-release-${{ matrix.target }}-${{ hashFiles('typst-desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-release-${{ matrix.target }}-

      - name: Install frontend dependencies
        working-directory: typst-desktop
        run: bun install --frozen-lockfile

      - name: Build application
        working-directory: typst-desktop
        run: bun run tauri build --target ${{ matrix.target }}

      - name: Collect packages
        shell: bash
        run: |
          mkdir -p packages
          bundle_dir="typst-desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          find "$bundle_dir" -type f \( \
            -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \
            -o -name "*.msi" -o -name "*-setup.exe" \
            -o -name "*.dmg" \
          \) -exec cp {} packages/ \;
          if [ -d "$bundle_dir/macos" ]; then
            for app_bundle in "$bundle_dir"/macos/*.app; do
              tar -czf "packages/$(basename "$app_bundle" .app)_${{ matrix.target }}.app.tar.gz" \
                -C "$bundle_dir/macos" "$(basename "$app_bundle")"
            done
          fi
          ls -la packages

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: typst-desktop-${{ matrix.name }}
          path: packages/*
          if-no-files-found: error

  build-arch:
    name: Build arch-x86_64
    runs-on: ubuntu-22.04
    container:
      image: archlinux:base-devel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: typst-desktop

      - name: Update pacman and install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            git rust bun webkit2gtk-4.1 gtk3 openssl xdg-utils pandoc-cli tinymist

      - name: Create unprivileged build user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Set package version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: typst-desktop/packaging/arch
        run: sed -i "s/^pkgver=.*/pkgver=${TAG#v}/" PKGBUILD
        env:
          TAG: ${{ github.ref_name }}

      - name: Build package
        working-directory: typst-desktop/packaging/arch
        run: runuser -u builder -- env TYPST_COMMIT="$TYPST_COMMIT" makepkg --noconfirm

      - name: Collect package
        run: |
          mkdir -p packages
          find typst-desktop/packaging/arch -maxdepth 1 -name "*.pkg.tar.zst" -exec cp {} packages/ \;
          ls -la packages

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: typst-desktop-arch-x86_64
          path: packages/*
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: packages/*
